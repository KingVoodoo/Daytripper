[package]
name = "daytripper"
version = "0.2.0"
description = "Standalone EVE Online wormhole mapper"
edition = "2021"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
keyring = { version = "3", features = ["windows-native"] }
tokio = { version = "1", features = ["sync", "net", "io-util", "time"] }
open = "5"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
jsonwebtoken = "9"
log = "0.4"
tract-onnx = "0.21"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm"] }
