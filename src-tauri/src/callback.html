<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; font-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"><title>Daytripper — EVE sign-in</title><style>body{margin:0}*{box-sizing:border-box}{{CSS}}</style></head>
<body><section class="splash splash-callback"><div class="splash-hero"><img id="background" class="splash-background" alt=""><main class="splash-content"><img class="splash-logo" src="{{LOGO}}" alt="Daytripper — Scan, map, explore, profit"><p class="splash-eyebrow">EVE SIGN-IN</p><h1>{{TITLE}}</h1><p class="splash-intro">{{MESSAGE}}</p><p class="splash-status">Return to the Daytripper desktop window to continue. You can close this browser tab whenever you are ready.</p></main>{{PORTRAIT}}</div><footer class="splash-feature"><div><p class="splash-eyebrow" id="region"></p><h2 id="title"></h2><p id="description"></p><p class="splash-tip" id="tip"></p></div><nav aria-label="Daytripper tips"><button id="previous" aria-label="Previous tip">Previous</button><button id="pause">Pause</button><button id="next" aria-label="Next tip">Next</button><button id="sound" aria-pressed="true">Sound on</button></nav></footer></section>
<script>
let soundEnabled=true,audio;
try{soundEnabled=localStorage.getItem('daytripper_click_sounds')!=='off'}catch{}
const soundButton=document.getElementById('sound');
function soundLabel(){soundButton.textContent=soundEnabled?'Sound on':'Sound off';soundButton.setAttribute('aria-pressed',String(soundEnabled))}soundLabel();
soundButton.onclick=()=>{soundEnabled=!soundEnabled;try{localStorage.setItem('daytripper_click_sounds',soundEnabled?'on':'off')}catch{}soundLabel()};
document.addEventListener('click',e=>{if(!soundEnabled||!e.isTrusted||!e.target.closest('button'))return;try{audio??=new AudioContext();void audio.resume().catch(()=>{});const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.frequency.setValueAtTime(1150,t);o.frequency.exponentialRampToValueAtTime(700,t+.045);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.025,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+.055);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.06);o.onended=()=>{o.disconnect();g.disconnect()}}catch{}},true);
history.replaceState(null,'','/');
const slides={{SLIDES}};
let index=0,paused=matchMedia('(prefers-reduced-motion: reduce)').matches;
function render(){const s=slides[index];document.getElementById('background').src=s.image;document.getElementById('region').textContent=s.region+' / '+(index+1)+' OF 08';document.getElementById('title').textContent=s.title;document.getElementById('description').textContent=s.description;document.getElementById('tip').textContent='TIP · '+s.tip;document.getElementById('pause').textContent=paused?'Play':'Pause'}
document.getElementById('previous').onclick=()=>{index=(index+7)%8;render()};document.getElementById('next').onclick=()=>{index=(index+1)%8;render()};document.getElementById('pause').onclick=()=>{paused=!paused;render()};setInterval(()=>{if(!paused&&!document.hidden){index=(index+1)%8;render()}},9000);render();
</script><script>{{ARWES}}</script></body></html>
